spring:
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      encoding: UTF-8
  application:
    name: tf-game
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:10.28.13.214:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:fm-prod}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        fail-fast: false
        metadata:
          version: ${APP_VERSION:dev}
          git-commit: ${GIT_COMMIT:unknown}
      config:
        namespace: ${NACOS_NAMESPACE:fm-prod}
        group: FM
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        file-extension: yaml
        import-check:
          enabled: false
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:10.28.13.214}:${MYSQL_PORT:3306}/${MYSQL_DB:fm_game}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_APP_USER:fm_game_app}
    password: ${MYSQL_APP_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:10.28.13.214}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}

server:
  port: 8104
  shutdown: graceful

app:
  # 运行环境标识：统一 JSON 日志的 env 字段来源；生产/测试栈分别注入 production/test
  environment: ${APP_ENV:production}
  version: ${APP_VERSION:dev}
  game:
    scheduling-enabled: ${GAME_SCHEDULING_ENABLED:true}
    min-players: ${GAME_MIN_PLAYERS:2}
    max-players: ${GAME_MAX_PLAYERS:16}
    invite-timeout-seconds: ${GAME_INVITE_TIMEOUT_SECONDS:300}
    rest-seconds: ${GAME_REST_SECONDS:60}
    move-timeout-seconds: ${GAME_MOVE_TIMEOUT_SECONDS:30}
    disconnect-timeout-seconds: ${GAME_DISCONNECT_TIMEOUT_SECONDS:60}
    ws-ticket-ttl-seconds: ${GAME_WS_TICKET_TTL_SECONDS:60}
    notification-ttl-seconds: ${GAME_NOTIFICATION_TTL_SECONDS:600}
    max-chat-length: ${GAME_MAX_CHAT_LENGTH:1000}
    allowed-origins: ${GAME_ALLOWED_ORIGINS:*}

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    propagation:
      type: W3C
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

fm:
  auth:
    enabled: ${FM_AUTH_ENABLED:true}
    user-service-url: ${TF_USER_URL:http://127.0.0.1:8101}
    identity-secret: ${FM_IDENTITY_SECRET:}
    allow-bearer-fallback: ${FM_AUTH_BEARER_FALLBACK:true}
    cache-ttl: ${FM_AUTH_CACHE_TTL:30s}
    public-paths:
      - /api/v1/game/health
      - /api/v1/game/meta
  common:
    error:
      service-unavailable-code: GAME_UNAVAILABLE
      service-unavailable-message: 排行服务暂不可用
