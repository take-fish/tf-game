spring:
  application:
    name: tf-game
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:10.28.25.234:8848}
      discovery:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        fail-fast: false
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:10.28.25.234}:${MYSQL_PORT:3306}/fm_game?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_APP_USER:fm_app}
    password: ${MYSQL_APP_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:10.28.25.234}
      port: ${REDIS_PORT:6379}

server:
  port: 8104

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
